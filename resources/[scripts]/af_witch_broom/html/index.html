<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="stylesheet" href="style.css">
    <title>Vassoura Magica</title>
</head>
<body>
    <aside id="broomHud" aria-hidden="true">
        <header>
            <span class="sigil">OF</span>
            <div>
                <strong>VASSOURA MAGICA</strong>
                <small id="flightState">VOO NATIVO ATIVO</small>
            </div>
        </header>
        <div class="readings">
            <div><span id="speed">0</span><small>KM/H</small></div>
            <i></i>
            <div><span id="altitude">0</span><small>METROS</small></div>
        </div>
        <div class="status-row">
            <span id="hoverStatus" class="active">HOVER NATIVO</span>
            <span id="boostStatus" class="active">IMPULSO PRONTO</span>
        </div>
        <footer>
            <span><kbd>W A S D</kbd> pilotar</span>
            <span><kbd>NUM 8/5</kbd> inclinar</span>
            <span><kbd>X</kbd> impulso</span>
            <span><kbd>F</kbd> pousar</span>
        </footer>
    </aside>
    <script src="app.js"></script>
</body>
</html>
